<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- SkyWatch-20 High-Precision Aerospace Compass Mask Overlay -->
  <!-- Compliant with MIL-STD-1472 Avionics Display Grid Scales -->
  
  <defs>
    <!-- Define glowing drop shadow filters for critical alert lines -->
    <filter id="radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="Tactical_Compass_Grid" stroke="#00803c" stroke-width="1.2" fill="none">
    <!-- Center Target Crosshair Master Anchor Coordinates -->
    <line x1="400" y1="40" x2="400" y2="760" stroke-opacity="0.3" stroke-dasharray="4,4"/>
    <line x1="40" y1="400" x2="760" y2="400" stroke-opacity="0.3" stroke-dasharray="4,4"/>

    <!-- Concentric Range Boundary Rings (Outer Defense Limits) -->
    <circle cx="400" cy="400" r="360" stroke="#00ff78" stroke-width="2" filter="url(#radar-glow)" />
    <circle cx="400" cy="400" r="270" stroke-opacity="0.6" />
    <circle cx="400" cy="400" r="180" stroke-opacity="0.4" />
    <circle cx="400" cy="400" r="90"  stroke-opacity="0.2" />

    <!-- Exact 30-Degree Directional Flight Tracking Compass Hashes -->
    <g transform="translate(400,400)" stroke="#00ff78" stroke-width="1.5">
      <line x1="0" y1="-360" x2="0" y2="-348" />
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(30)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(60)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(90)" />
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(120)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(150)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(180)" />
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(210)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(240)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(270)" />
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(300)" stroke-opacity="0.7"/>
      <line x1="0" y1="-360" x2="0" y2="-348" transform="rotate(330)" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- Flight Path Runway Approach Corridor Vector Shapes -->
  <g id="Approach_Corridors" stroke="#00ffda" stroke-width="1" stroke-opacity="0.4" fill="none">
    <!-- Funnel shape directing incoming tracks safely into center coordinate target zones -->
    <polygon points="100,350 250,380 400,400 250,420 100,450" stroke-dasharray="5,3"/>
  </g>

  <!-- Interface HUD Overlay Markings -->
  <g id="HUD_Text_Labels" fill="#00ff78" font-family="Courier New, monospace" font-size="12" font-weight="bold">
    <text x="415" y="65">N  000°</text>
    <text x="735" y="415">E  090°</text>
    <text x="415" y="755">S  180°</text>
    <text x="45"  y="415">W  270°</text>
    <text x="50"  y="50" font-size="14" fill="#00ffda">RANGE: 40 NM</text>
    <text x="50"  y="70" font-size="11" fill-opacity="0.6">SYS: ENVELOPE SECURE</text>
  </g>
</svg>
