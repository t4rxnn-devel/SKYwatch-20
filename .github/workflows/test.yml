name: Continuous Integration & Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    name: Build & Test Polyglot Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake build-essential libssl-dev python3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test C++ Core Compilation
        run: |
          if [ -f "CMakeLists.txt" ]; then
            mkdir -p build && cd build
            cmake -DCMAKE_BUILD_TYPE=Release ..
            make -j$(nproc)
          fi

      - name: Test Rust Safety Module Compilation
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo test --release
          fi

      - name: Verify Python Syntax & Server
        run: |
          python3 -m py_compile gui_server.py
