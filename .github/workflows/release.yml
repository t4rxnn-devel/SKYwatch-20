name: Build Pre-Compiled Release Bundles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Bundle Archive
        run: |
          mkdir -p package_dir
          # Safely copy files into package directory
          cp -r ./* package_dir/ 2>/dev/null || true
          tar -czvf skywatch-20-release.tar.gz -C package_dir .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: skywatch-20-release.tar.gz
          generate_release_notes: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
