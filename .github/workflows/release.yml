name: Build Pre-Compiled Release Bundles

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev python3 python3-pip

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build C++ IMM-UKF Core
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Build Rust Safety Auditor
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --release
          fi

      - name: Assemble Release Bundle
        run: |
          mkdir -p package_dir
          cp -r index.html gui_server.py include config scripts start_app.bat start_app.command package_dir/
          
          # Copy compiled binaries into package
          mkdir -p package_dir/build
          cp build/skywatch_core package_dir/build/ 2>/dev/null || true
          
          tar -czvf skywatch-20-linux-x64.tar.gz -C package_dir .
          zip -r skywatch-20-windows-x64.zip package_dir/*

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: |
            skywatch-20-linux-x64.tar.gz
            skywatch-20-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
