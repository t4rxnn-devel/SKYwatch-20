name: Build Pre-Compiled Release Bundles

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Release Bundles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev python3 tar zip

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build C++ Core
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Build Rust Safety Auditor
        run: |
          if [ -f "Cargo.toml" ]; then
            cargo build --release
          fi

      - name: Assemble Release Archives
        run: |
          mkdir -p package_dir
          cp -r index.html gui_server.py include config scripts start_app.bat start_app.command package_dir/
          mkdir -p package_dir/build package_dir/target/release
          cp build/skywatch_core package_dir/build/ 2>/dev/null || true
          cp target/release/tcas_automation package_dir/target/release/ 2>/dev/null || true
          
          tar -czvf skywatch-20-linux-x64.tar.gz -C package_dir .
          cd package_dir && zip -r ../skywatch-20-windows-x64.zip . && cd ..

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            skywatch-20-linux-x64.tar.gz
            skywatch-20-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
