<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch-20 Instrumented RK45 Tactical Radar Console</title>
    <link rel="stylesheet" href="include/app_styles.css">
</head>
<body>
    <h1>=== SKYWATCH-20 TACTICAL INTERFACE ===</h1>
    <p>Production Build Framework: Dynamic Instrumented Range Matrix</p>
    
    <div id="radar-viewport">
        <div id="warning-banner">⚠️ [ALARM] NO ACTIVE PERIMETER WARNINGS</div>
    </div>

    <div id="control-panel">
        <div class="form-group">
            <label for="flightId">Callsign / Flight ID</label>
            <input type="text" id="flightId" value="SU-57" maxlength="7">
        </div>
        <div class="form-group">
            <label for="speedKnots">Target Cruise Speed (KT)</label>
            <input type="number" id="speedKnots" value="550" min="150" max="1200">
        </div>
        <div class="form-group">
            <label for="posX">Initial Position X (NM)</label>
            <input type="number" id="posX" value="-18">
        </div>
        <div class="form-group">
            <label for="posY">Initial Position Y (NM)</label>
            <input type="number" id="posY" value="-12">
        </div>
        <button class="spawn-btn" id="spawnBtn">Inject Operational Target Track</button>

        <div id="matrix-module">
            <label>Instrumented Radar Range Configuration Selector Matrix</label>
            <div class="matrix-row">
                <button class="matrix-btn" id="range10">10 NM Range Scale</button>
                <button class="matrix-btn" id="range20">20 NM Range Scale</button>
                <button class="matrix-btn active" id="range40">40 NM Range Scale</button>
            </div>
        </div>
    </div>

    <!-- Master WebGL ES6 Module Initialization Framework -->
    <script type="module">
        import * as THREE from 'https://cloudflare.com';
        import { RadarRangePhysicsEngine } from './include/physics_solver.js';

        const container = document.getElementById('radar-viewport');
        const warningBanner = document.getElementById('warning-banner');
        
        // 1. Initialize our Functional Range & Aerodynamics Core
        const rangePhysics = new RadarRangePhysicsEngine(40.0);

        // 2. Setup Three.js 3D Hardware Accelerated Pipeline
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020f05);
        
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 38, 42);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x003311));
        const dirLight = new THREE.DirectionalLight(0x00ff78, 0.9);
        dirLight.position.set(10, 30, 10);
        scene.add(dirLight);

        // Dynamic Range Rings Group Layer
        let gridGroup = new THREE.Group();
        scene.add(gridGroup);

        function rebuildDisplayRadarRings() {
            // Flush old scene layout variables cleanly to prevent memory leaks
            while(gridGroup.children.length > 0) { 
                gridGroup.remove(gridGroup.children[0]); 
            }
            
            const gridMat = new THREE.LineBasicMaterial({ color: 0x003311, transparent: true, opacity: 0.7 });
            const currentRange = rangePhysics.instrument_range_nm;
            const step_size_nm = currentRange / 4;

            // Generate concentric ring markers based directly on the running numerical range
            for (let r_nm = step_size_nm; r_nm <= currentRange; r_nm += step_size_nm) {
                const points = [];
                // Map the absolute nautical mileage down into WebGL Scene display bounds
                const mappedRadius = (r_nm / currentRange) * rangePhysics.max_display_radius;
                
                for (let i = 0; i <= 64; i++) {
                    const theta = (i / 64) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * mappedRadius, 0, Math.sin(theta) * mappedRadius));
                }
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                gridGroup.add(new THREE.Line(geo, gridMat));
            }
        }
        rebuildDisplayRadarRings();

        // 3. Environment Doppler Storm Configuration Cells
        const storms = [
            { center: new THREE.Vector3(8, 0, 6), radius: 5.5, windForce: 0.18, shearDirection: new THREE.Vector3(-1, 0, -0.5).normalize() },
            { center: new THREE.Vector3(-10, 0, -8), radius: 6.0, windForce: 0.25, shearDirection: new THREE.Vector3(0.5, 0, 1).normalize() }
        ];

        storms.forEach(storm => {
            const stormGeo = new THREE.CylinderGeometry(storm.radius, storm.radius, 0.2, 32);
            const stormMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.04 });
            const mesh = new THREE.Mesh(stormGeo, stormMat);
            
            // Initial coordinate transformations mapping weather down to screen canvas positions
            const dispCoords = rangePhysics.mapPhysicalCoordinatesToDisplaySpace(storm.center.x, storm.center.z, storm.center.y);
            mesh.position.set(dispCoords.x, dispCoords.y, dispCoords.z);
            scene.add(mesh);
        });

        // 4. Procedural Aviation CAD Delta-Wing Target Generator
        function createCadAircraftMesh() {
            const group = new THREE.Group();
            const hullMat = new THREE.MeshStandardMaterial({ color: 0x00bc56, roughness: 0.3, metalness: 0.7, flatShading: true });
            
            const bodyGeo = new THREE.ConeGeometry(0.35, 2.8, 4);
            bodyGeo.rotateX(Math.PI / 2);
            const body = new THREE.Mesh(bodyGeo, hullMat);
            group.add(body);

            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0); wingShape.lineTo(2.4, -1.3); wingShape.lineTo(0.4, -1.7); wingShape.lineTo(0, -1.7);
            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.04, bevelEnabled: false });
            wingGeo.rotateX(Math.PI / 2);
            const rw = new THREE.Mesh(wingGeo, hullMat);
            const lw = new THREE.Mesh(wingGeo, hullMat); lw.scale.x = -1;
            group.add(rw, lw);

            return group;
        }

        let fleet = [];

        function spawnAircraft(id, x_nm, y_nm, knots) {
            const mesh = createCadAircraftMesh(); 
            scene.add(mesh);
            
            let initAngle = Math.atan2(-y_nm, -x_nm);
            
            fleet.push({
                id: id, mesh: mesh,
                phys_pos: new THREE.Vector3(x_nm, 1.5, y_nm), // Real position coordinates tracked in absolute miles
                phys_vel: new THREE.Vector3(Math.cos(initAngle) * (knots/10.0), 0, Math.sin(initAngle) * (knots/10.0)),
                targetSpeed: knots, currentRoll: 0
            });
        }

        // Initialize Base Tracking Telemetry Dataset
        spawnAircraft("UAL104", -19, -14, 520);
        spawnAircraft("AAL892", 17, 15, 480);
        spawnAircraft("DAL440", -15, 19, 610);

        document.getElementById('spawnBtn').addEventListener('click', () => {
            const id = document.getElementById('flightId').value.toUpperCase().trim() || "UNK";
            const speed = parseFloat(document.getElementById('speedKnots').value) || 500;
            const x = parseFloat(document.getElementById('posX').value) || 0;
            const y = parseFloat(document.getElementById('posY').value) || 0;
            spawnAircraft(id, x, y, speed);
        });

        // --- INTERACTIVE RANGE SCALE MATRIX SELECTOR HANDLERS ---
        const resetRangeButtons = () => document.querySelectorAll('.matrix-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById('range10').addEventListener('click', (e) => {
            resetRangeButtons(); e.target.classList.add('active');
            rangePhysics.setInstrumentRange(10.0); rebuildDisplayRadarRings();
        });
        document.getElementById('range20').addEventListener('click', (e) => {
            resetRangeButtons(); e.target.classList.add('active');
            rangePhysics.setInstrumentRange(20.0); rebuildDisplayRadarRings();
        });
        document.getElementById('range40').addEventListener('click', (e) => {
            resetRangeButtons(); e.target.classList.add('active');
            rangePhysics.setInstrumentRange(40.0); rebuildDisplayRadarRings();
        });

        const sweepGeo = new THREE.ConeGeometry(34, 0.05, 32, 1, true, 0, 0.12);
        const sweepMat = new THREE.MeshBasicMaterial({ color: 0x00ff78, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
        const sweeper = new THREE.Mesh(sweepGeo, sweepMat);
        sweeper.rotateX(Math.PI / 2);
        scene.add(sweeper);

        const clock = new THREE.Clock();

        // 5. MASTER SYSTEM CLOCK FRAME SYNC ENGINE LOOP
        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            sweeper.rotation.z -= 0.65 * dt;

            let activeWarnings = [];

            fleet.forEach(ac => {
                // Determine if tracking node is inside storm parameters limits
                let inside_storm = false;
                storms.forEach(storm => {
                    if (ac.phys_pos.distanceTo(storm.center) <= storm.radius) inside_storm = true;
                });

                                // PIPELINE STEP 1: Compute true higher-order fluid physics mechanics
                rangePhysics.computeAdaptiveRkf45Step(ac.phys_pos, ac.phys_vel, ac.targetSpeed, dt * 0.05, inside_storm);
                
                // Wrap positions elegantly if they cross global airspace tracking limits
                if (ac.phys_pos.length() > 45.0) {
                    ac.phys_pos.set(-ac.phys_pos.x, ac.phys_pos.y, -ac.phys_pos.z);
                }

                // PIPELINE STEP 2: Evaluate target tracking parameters against the live instrument range
                if (rangePhysics.isTargetWithinInstrumentRange(ac.phys_pos.x, ac.phys_pos.z)) {
                    ac.mesh.visible = true;

                    // PIPELINE STEP 3: Map spatial absolute miles cleanly to WebGL display positions
                    const dispCoords = rangePhysics.mapPhysicalCoordinatesToDisplaySpace(ac.phys_pos.x, ac.phys_pos.z, ac.phys_pos.y);
                    ac.mesh.position.set(dispCoords.x, dispCoords.y, dispCoords.z);

                    // Dynamic orientation yaw configurations
                    let actualHeadingAngle = Math.atan2(ac.phys_vel.z, ac.phys_vel.x);
                    ac.mesh.rotation.y = -actualHeadingAngle + Math.PI / 2;

                    // Electronic sweeping beam intersection target highlights
                    const currentSweepAngle = (sweeper.rotation.z) % (Math.PI * 2);
                    const acAngle = Math.atan2(dispCoords.z, dispCoords.x);
                    if (Math.abs(currentSweepAngle - acAngle) < 0.2) {
                        ac.mesh.children.forEach(part => part.material.color.setHex(0x00ffda));
                    } else {
                        ac.mesh.children.forEach(part => part.material.color.setHex(0x00bc56));
                    }
                } else {
                    // Instantly drop target rendering visibility if out of selected instrument range bounds
                    ac.mesh.visible = false;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
