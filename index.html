<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch-20 Modular 3D Interface System</title>
    <!-- Link the standalone visual design sheet assets directly -->
    <link rel="stylesheet" href="include/app_styles.css">
</head>
<body>
    <h1>=== SKYWATCH-20 ADVANCED RK4 INTERFACE ===</h1>
    <p>High-Precision 4th-Order Runge-Kutta Aerospace Solver Engine</p>
    
    <div id="radar-viewport">
        <div id="warning-banner">⚠️ [ALARM] NO ACTIVE WARNINGS</div>
    </div>

    <div id="control-panel">
        <div class="form-group">
            <label for="flightId">Callsign / Flight ID</label>
            <input type="text" id="flightId" value="SU-57" maxlength="7">
        </div>
        <div class="form-group">
            <label for="speedKnots">Target Cruise Speed (Knots)</label>
            <input type="number" id="speedKnots" value="550" min="150" max="1200">
        </div>
        <div class="form-group">
            <label for="posX">Initial X Vector (NM)</label>
            <input type="number" id="posX" value="-18">
        </div>
        <div class="form-group">
            <label for="posY">Initial Y Vector (NM)</label>
            <input type="number" id="posY" value="-12">
        </div>
        <button class="spawn-btn" id="spawnBtn">Inject High-Precision Target Vector</button>

        <div id="matrix-module">
            <label>Perspective Orientation Matrix</label>
            <div class="matrix-row">
                <button class="matrix-btn active" id="camTower">Tower Strategic (Overhead)</button>
                <button class="matrix-btn" id="camTactical">Tactical Incline (Isometric)</button>
                <button class="matrix-btn" id="camHorizon">Horizon Wide (Low Angle)</button>
            </div>
        </div>
    </div>

    <!-- Initialize master animation engine hooks as an ES6 Module tracker -->
    <script type="module">
        import * as THREE from 'https://cloudflare.com';
        import { computeRk4Step } from './include/physics_solver.js';

        const container = document.getElementById('radar-viewport');
        const warningBanner = document.getElementById('warning-banner');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020f05);
        
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 38, 42);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x003311));
        const dirLight = new THREE.DirectionalLight(0x00ff78, 0.9);
        dirLight.position.set(10, 30, 10);
        scene.add(dirLight);

        const gridGroup = new THREE.Group();
        const gridMat = new THREE.LineBasicMaterial({ color: 0x003311 });
        for (let r = 5; r <= 25; r += 5) {
            const points = [];
            for (let i = 0; i <= 64; i++) {
                const theta = (i / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r));
            }
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            gridGroup.add(new THREE.Line(geo, gridMat));
        }
        scene.add(gridGroup);

        const storms = [
            { center: new THREE.Vector3(8, 0, 6), radius: 5.5, windForce: 0.18, shearDirection: new THREE.Vector3(-1, 0, -0.5).normalize() },
            { center: new THREE.Vector3(-10, 0, -8), radius: 6.0, windForce: 0.25, shearDirection: new THREE.Vector3(0.5, 0, 1).normalize() }
        ];

        storms.forEach(storm => {
            const stormGeo = new THREE.CylinderGeometry(storm.radius, storm.radius, 0.2, 32);
            const stormMat = new THREE.MeshBasicMaterial({ color: 0xff3300, transparent: true, opacity: 0.04 });
            const mesh = new THREE.Mesh(stormGeo, stormMat);
            mesh.position.copy(storm.center);
            scene.add(mesh);
        });

        function createCadAircraftMesh() {
            const group = new THREE.Group();
            const hullMat = new THREE.MeshStandardMaterial({ color: 0x00bc56, roughness: 0.3, metalness: 0.7, flatShading: true });
            
            const bodyGeo = new THREE.ConeGeometry(0.35, 2.8, 4);
            bodyGeo.rotateX(Math.PI / 2);
            const body = new THREE.Mesh(bodyGeo, hullMat);
            group.add(body);

            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0); wingShape.lineTo(2.4, -1.3); wingShape.lineTo(0.4, -1.7); wingShape.lineTo(0, -1.7);
            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.04, bevelEnabled: false });
            wingGeo.rotateX(Math.PI / 2);
            const rw = new THREE.Mesh(wingGeo, hullMat);
            const lw = new THREE.Mesh(wingGeo, hullMat); lw.scale.x = -1;
            group.add(rw, lw);

            const finShape = new THREE.Shape();
            finShape.moveTo(0, 0); finShape.lineTo(0, 0.7); finShape.lineTo(-0.4, 0.7); finShape.lineTo(-0.7, 0);
            const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.03, bevelEnabled: false });
            finGeo.rotateY(Math.PI / 2);
            const fr = new THREE.Mesh(finGeo, hullMat); fr.position.set(0.25, 0.1, -1.1); fr.rotation.z = -0.25;
            const fl = new THREE.Mesh(finGeo, hullMat); fl.position.set(-0.25, 0.1, -1.1); fl.rotation.z = 0.25;
            group.add(fr, fl);

            return group;
        }

        let fleet = [];

        function spawnAircraft(id, x, z, knots) {
            const mesh = createCadAircraftMesh(); scene.add(mesh);
            let targetVelocityScalar = (knots / 600.0) * 1.5; let initAngle = Math.atan2(-z, -x);
            fleet.push({
                id: id, mesh: mesh, pos: new THREE.Vector3(x, 1.5, z),
                vel: new THREE.Vector3(Math.cos(initAngle) * 0.5, 0, Math.sin(initAngle) * 0.5),
                targetSpeed: targetVelocityScalar, currentYaw: initAngle, currentRoll: 0
            });
        }

        spawnAircraft("UAL104", -19, -14, 520);
        spawnAircraft("AAL892", 17, 15, 480);
        spawnAircraft("DAL440", -15, 19, 610);

        document.getElementById('spawnBtn').addEventListener('click', () => {
            const id = document.getElementById('flightId').value.toUpperCase().trim() || "UNK";
            const speed = parseFloat(document.getElementById('speedKnots').value) || 500;
            const x = parseFloat(document.getElementById('posX').value) || 0;
            const z = parseFloat(document.getElementById('posY').value) || 0;
            spawnAircraft(id, x, z, speed);
        });

        let targetCamPos = new THREE.Vector3(0, 38, 42);
        const resetMatrixButtons = () => document.querySelectorAll('.matrix-btn').forEach(b => b.classList.remove('active'));

        document.getElementById('camTower').addEventListener('click', (e) => {
            resetMatrixButtons(); e.target.classList.add('active'); targetCamPos.set(0, 38, 42);
        });
        document.getElementById('camTactical').addEventListener('click', (e) => {
            resetMatrixButtons(); e.target.classList.add('active'); targetCamPos.set(18, 22, 25);
        });
        document.getElementById('camHorizon').addEventListener('click', (e) => {
            resetMatrixButtons(); e.target.classList.add('active'); targetCamPos.set(0, 4, 32);
        });

        const sweepGeo = new THREE.ConeGeometry(34, 0.05, 32, 1, true, 0, 0.12);
        const sweepMat = new THREE.MeshBasicMaterial({ color: 0x00ff78, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
        const sweeper = new THREE.Mesh(sweepGeo, sweepMat);
        sweeper.rotateX(Math.PI / 2);
        scene.add(sweeper);

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            sweeper.rotation.z -= 0.65 * dt;

            camera.position.lerp(targetCamPos, 0.05);
            camera.lookAt(0, 0, 0);

            let activeWarnings = [];

            fleet.forEach(ac => {
                // EXECUTING THE REDIRECTED SEPARATE MODULE INCLUDED HOOK
                computeRk4Step(ac, storms, dt);
                
                if (ac.pos.length() > 32) ac.pos.set(-ac.pos.x, ac.pos.y, -ac.pos.z);
                ac.mesh.position.copy(ac.pos);

                let actualHeadingAngle = Math.atan2(ac.vel.z, ac.vel.x);
                ac.mesh.rotation.y = -actualHeadingAngle + Math.PI / 2;

                let lateralForce = ac.vel.x * ac.vel.z; 
                let targetRoll = -lateralForce * 4.5; 
                
                storms.forEach(storm => {
                    if (ac.pos.distanceTo(storm.center) <= storm.radius) {
                        targetRoll += Math.sin(clock.getElapsedTime() * 25.0) * 0.04;
                        activeWarnings.push(`${ac.id} ENCOUNTERING SEVERE TURBULENCE FORCE VECTOR`);
                    }
                });
                
                ac.currentRoll = THREE.MathUtils.lerp(ac.currentRoll, targetRoll, 0.08);
                ac.mesh.rotation.z = ac.currentRoll;

                const currentSweepAngle = (sweeper.rotation.z) % (Math.PI * 2);
                const acAngle = Math.atan2(ac.pos.z, ac.pos.x);
                if (Math.abs(currentSweepAngle - acAngle) < 0.2) {
                    ac.mesh.children.forEach(part => part.material.color.setHex(0x00ffda));
                } else {
                    ac.mesh.children.forEach(part => part.material.color.setHex(0x00bc56));
                }
            });

            if (activeWarnings.length > 0) {            // TRIGGER WARNING TICKER HUD EVENTS
            if (activeWarnings.length > 0) {
                warningBanner.style.display = "block";
                warningBanner.innerText = `⚠️ [TCAS HAZARD]: ${activeWarnings.join(" | ")}`;
            } else {
                warningBanner.style.display = "none";
            }

            renderer.render(scene, camera);
        }

        animate();

        // Responsive display boundary update listener
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
