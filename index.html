<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyWatch-20 3D Tactical Interface System</title>
    <style>
        body {
            background-color: #010803;
            color: #00ff78;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-y: auto;
            padding: 20px 0;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            letter-spacing: 2px;
            text-shadow: 0 0 5px #00ff78;
        }
        p {
            margin: 5px 0 15px 0;
            font-size: 12px;
            color: rgba(0, 255, 120, 0.6);
        }
        #radar-viewport {
            position: relative;
            width: 700px;
            height: 600px;
            border: 2px solid #005000;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 255, 120, 0.15);
            background-color: #020f05;
            overflow: hidden;
        }
        #control-panel {
            margin-top: 20px;
            width: 670px;
            background: rgba(0, 30, 5, 0.6);
            border: 1px solid #005000;
            padding: 15px;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 11px; text-transform: uppercase; margin-bottom: 4px; color: rgba(0, 255, 120, 0.8); }
        input { background: #020f05; border: 1px solid #008000; color: #00ff78; padding: 6px; font-family: inherit; font-size: 13px; }
        input:focus { outline: none; border-color: #00ff78; }
        button { grid-column: span 2; background: #005000; border: 1px solid #00ff78; color: #00ff78; padding: 10px; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 2px; }
        button:hover { background: #00ff78; color: #020f05; box-shadow: 0 0 10px #00ff78; }
    </style>
    <!-- Include Three.js via CDN for 3D Hardware Accelerated Rendering -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <h1>=== SKYWATCH-20 3D TACTICAL INTERFACE ===</h1>
    <p>Hardware Accelerated CAD Modeling Environment</p>
    
    <div id="radar-viewport"></div>

    <div id="control-panel">
        <div class="form-group">
            <label for="flightId">Callsign / Flight ID</label>
            <input type="text" id="flightId" value="F-22" maxlength="7">
        </div>
        <div class="form-group">
            <label for="altitude">Altitude (FT / 1000)</label>
            <input type="number" id="altitude" value="8.0" step="0.5">
        </div>
        <div class="form-group">
            <label for="posX">Initial X Vector (NM)</label>
            <input type="number" id="posX" value="-15">
        </div>
        <div class="form-group">
            <label for="posY">Initial Y Vector (NM)</label>
            <input type="number" id="posY" value="-15">
        </div>
        <button id="spawnBtn">Inject Jet Fighter Target Vector</button>
    </div>

    <script>
        // --- 1. INITIALIZE THREE.JS 3D ENGINE GRAPHICS MATRIX ---
        const container = document.getElementById('radar-viewport');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020f05);
        
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        // Position camera overhead at an isometric perspective angle for strategic visualization
        camera.position.set(0, 35, 45);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Illuminations Layout Matrix
        const ambientLight = new THREE.AmbientLight(0x004411);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0x00ff78, 0.8);
        directionalLight.position.set(5, 20, 5);
        scene.add(directionalLight);

        // --- 2. GENERATE CONCENTRIC CAD RADAR GRIDS ---
        const gridGroup = new THREE.Group();
        const gridMaterial = new THREE.LineBasicMaterial({ color: 0x004411 });
        
        for (let r = 5; r <= 25; r += 5) {
            const points = [];
            for (let i = 0; i <= 64; i++) {
                const theta = (i / 64) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * r, 0, Math.sin(theta) * r));
            }
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const circle = new THREE.Line(geometry, gridMaterial);
            gridGroup.add(circle);
        }
        
        // Axis Crosshairs
        const axisMat = new THREE.LineBasicMaterial({ color: 0x002205 });
        const xGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-30, 0, 0), new THREE.Vector3(30, 0, 0)]);
        const zGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -30), new THREE.Vector3(0, 0, 30)]);
        gridGroup.add(new THREE.Line(xGeo, axisMat), new THREE.Line(zGeo, axisMat));
        scene.add(gridGroup);

        // --- 3. PROCEDURAL CAD HIGH-REALISM AIRCRAFT GENERATOR ---
        // Creates a clean, realistic twin-engine stealth fighter geometry via code primitives
        function createCadAircraftMesh() {
            const aircraftGroup = new THREE.Group();
            const hullMat = new THREE.MeshStandardMaterial({ 
                color: 0x00bc56, 
                roughness: 0.4, 
                metalness: 0.8,
                flatShading: true 
            });

            // Jet Fuselage Structure
            const bodyGeo = new THREE.ConeGeometry(0.4, 3, 4);
            bodyGeo.rotateX(Math.PI / 2);
            const body = new THREE.Mesh(bodyGeo, hullMat);
            aircraftGroup.add(body);

            // Main Delta Wings Shape
            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0);
            wingShape.lineTo(2.5, -1.2);
            wingShape.lineTo(0.5, -1.8);
            wingShape.lineTo(0, -1.8);

            const wingExtrudeSettings = { depth: 0.05, bevelEnabled: false };
            const wingGeo = new THREE.ExtrudeGeometry(wingShape, wingExtrudeSettings);
            wingGeo.rotateX(Math.PI / 2);
            
            const rightWing = new THREE.Mesh(wingGeo, hullMat);
            const leftWing = new THREE.Mesh(wingGeo, hullMat);
            leftWing.scale.x = -1; // Flip wing structure along mirror coordinates
            aircraftGroup.add(rightWing, leftWing);

            // Twin Vertical Stabilizer Fins
            const finShape = new THREE.Shape();
            finShape.moveTo(0, 0);
            finShape.lineTo(0, 0.8);
            finShape.lineTo(-0.5, 0.8);
            finShape.lineTo(-0.8, 0);
            
            const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.04, bevelEnabled: false });
            finGeo.rotateY(Math.PI / 2);
            
            const finRight = new THREE.Mesh(finGeo, hullMat);
            finRight.position.set(0.3, 0.1, -1.2);
            finRight.rotation.z = -0.2; // Angle stabilizers outwards like an F-22 Raptor
            
            const finLeft = new THREE.Mesh(finGeo, hullMat);
            finLeft.position.set(-0.3, 0.1, -1.2);
            finLeft.rotation.z = 0.2;
            aircraftGroup.add(finRight, finLeft);

            return aircraftGroup;
        }

        // --- 4. ENGINE TRACKING FLEET MATRIX CAPABILITIES ---
        let fleet = [];

        function spawnAircraft(id, x, z, alt) {
            const mesh = createCadAircraftMesh();
            scene.add(mesh);

            // Calculate flight direction towards tracking radar center point coordinate anchor
            const angleToCenter = Math.atan2(-z, -x);
            const speed = 0.04;

            fleet.push({
                id: id,
                mesh: mesh,
                pos: new THREE.Vector3(x, alt, z),
                vel: new THREE.Vector3(Math.cos(angleToCenter) * speed, 0, Math.sin(angleToCenter) * speed),
                targetRotationY: angleToCenter + Math.PI / 2,
                currentRoll: 0,
                altitude: alt
            });
        }

        // Setup Initial Standard Fleet Operations Paths
        spawnAircraft("UAL104", -18, -12, 4.0);
        spawnAircraft("AAL892", 16, 14, 5.5);
        spawnAircraft("DAL440", -14, 18, 3.2);

        // UI Event Hook to inject custom profiles dynamically
        document.getElementById('spawnBtn').addEventListener('click', () => {
            const id = document.getElementById('flightId').value.toUpperCase().trim() || "UNK";
            const alt = parseFloat(document.getElementById('altitude').value) / 2.0 || 4.0; // Scaled altitude metric
            const x = parseFloat(document.getElementById('posX').value) || 0;
            const z = parseFloat(document.getElementById('posY').value) || 0;
            spawnAircraft(id, x, z, alt);
        });

        // --- 5. SWEEPER RADAR BEAM CONE ---
        const sweepGeometry = new THREE.ConeGeometry(32, 0.1, 32, 1, true, 0, 0.15);
        const sweepMaterial = new THREE.MeshBasicMaterial({ 
            color: 0x00ff78, 
            transparent: true, 
            opacity: 0.15, 
            side: THREE.DoubleSide 
        });
        const sweeper = new THREE.Mesh(sweepGeometry, sweepMaterial);
        sweeper.rotateX(Math.PI / 2);
        scene.add(sweeper);

        // --- 6. REALISTIC KINEMATICS PHYSICS LOOP ANIMATION ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Rotate main electronic sweep scanner line
            sweeper.rotation.z -= 0.6 * delta;

            fleet.forEach(ac => {
                // Update 3D coordinates based on independent velocity vector values
                ac.pos.add(ac.vel);

                // Re-route if boundaries metrics crossed
                if (ac.pos.length() > 30) {
                    ac.pos.set(-ac.pos.x, ac.pos.y, -ac.pos.z);
                }

                // Apply values directly into three mesh model matrices
                ac.mesh.position.copy(ac.pos);

                // HIGH-REALISM MOTION MATRIX: Interpolate rotation yaw angles smoothly
                ac.mesh.rotation.y = THREE.MathUtils.lerp(ac.mesh.rotation.y, ac.targetRotationY, 0.05);

                // HIGH-REALISM BANKING INTERACTION: Simulate realistic roll posture changes as they move
                const movementAngle = Math.sin(clock.getElapsedTime() * 1.5) * 0.15;
                ac.mesh.rotation.z = THREE.MathUtils.lerp(ac.mesh.rotation.z, movementAngle, 0.1);
                
                // Track lighting indices dynamically based on sweep intersections angles
                const currentSweepAngle = (sweeper.rotation.z) % (Math.PI * 2);
                const acAngle = Math.atan2(ac.pos.z, ac.pos.x);
                
                // Flash model colors bright cyan if currently tracked by active scanner beam
                if (Math.abs(currentSweepAngle - acAngle) < 0.2) {
                    ac.mesh.children.forEach(part => part.material.color.setHex(0x00ffda));
                } else {
                    ac.mesh.children.forEach(part => part.material.color.setHex(0x00bc56));
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Frame Handler to prevent rendering glitches on window shifts
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
