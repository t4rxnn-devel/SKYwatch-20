<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYwatch-20 High-Graphics Tactical Radar Console</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020608;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #hud-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0,255,204,0.7);
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Three.js CDN for 3D Flight & Fighter Jet Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud-overlay">
        <div>MODE: TACTICAL AIR DEFENSE (60 FPS)</div>
        <div id="fps-counter">FPS: 60.0</div>
        <div id="latency-counter">NET LATENCY: 0.2 ms</div>
        <div id="target-count" style="margin-top: 10px; color: #ff3333;">ACTIVE TARGETS: 0</div>
    </div>
    
    <div id="canvas-container"></div>

    <script>
        // Initialize Scene, Camera, and WebGL Renderer
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020608, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 80, 80);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Grid & Tactical Radar Scope Ring
        const gridHelper = new THREE.GridHelper(200, 40, 0x005544, 0x00221f);
        scene.add(gridHelper);

        const ringGeometry = new THREE.RingGeometry(40, 40.5, 64);
        const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const radarRing = new THREE.Mesh(ringGeometry, ringMaterial);
        radarRing.rotation.x = Math.PI / 2;
        scene.add(radarRing);

        // Spawn Simulated Fighter Jets (F-16 / F-35 Mock Geometries)
        const fighterJets = [];
        const jetMaterial = new THREE.MeshPhongMaterial({ color: 0x00ffcc, wireframe: true });

        function createFighterJet(x, z, speed) {
            const group = new THREE.Group();
            
            // Fuselage
            const bodyGeo = new THREE.ConeGeometry(1.5, 6, 4);
            bodyGeo.rotateX(Math.PI / 2);
            const body = new THREE.Mesh(bodyGeo, jetMaterial);
            group.add(body);

            // Wings
            const wingGeo = new THREE.BoxGeometry(8, 0.1, 2);
            const wings = new THREE.Mesh(wingGeo, jetMaterial);
            wings.position.set(0, 0, 0.5);
            group.add(wings);

            group.position.set(x, 5, z);
            scene.add(group);
            return { mesh: group, speed: speed, angle: Math.random() * Math.PI * 2, radius: Math.sqrt(x*x + z*z) };
        }

        // Spawn 6 tactical jets into the airspace
        for (let i = 0; i < 6; i++) {
            const angle = (i / 6) * Math.PI * 2;
            const dist = 25 + Math.random() * 30;
            fighterJets.push(createFighterJet(Math.cos(angle) * dist, Math.sin(angle) * dist, 0.02 + Math.random() * 0.02));
        }

        document.getElementById('target-count').innerText = `ACTIVE TARGETS: ${fighterJets.length}`;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        // Animation & Radar Sweep Loop
        let lastTime = performance.now();
        let frameCount = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Orbit jets in formation
            fighterJets.forEach(jet => {
                jet.angle += jet.speed * 0.5;
                jet.mesh.position.x = Math.cos(jet.angle) * jet.radius;
                jet.mesh.position.z = Math.sin(jet.angle) * jet.radius;
                jet.mesh.rotation.y = -jet.angle - Math.PI / 2;
            });

            renderer.render(scene, camera);

            // FPS Counter calculation
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastTime >= 1000) {
                document.getElementById('fps-counter').innerText = `FPS: ${(frameCount * 1000 / (currentTime - lastTime)).toFixed(1)}`;
                frameCount = 0;
                lastTime = currentTime;
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
