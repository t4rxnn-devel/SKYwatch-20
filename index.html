<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SKYwatch-20 High-Graphics Tactical Radar Console</title>
    <style>
        body { margin: 0; overflow: hidden; background: #020608; font-family: 'Courier New', monospace; }
        #canvas-hud { width: 100vw; height: 100vh; display: block; }
        #overlay-ui {
            position: absolute; top: 20px; left: 20px; color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.8); pointer-events: none;
        }
        .hud-metric { font-size: 14px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div id="overlay-ui">
        <div class="hud-metric">MODE: TACTICAL AIR DEFENSE (60 FPS)</div>
        <div class="hud-metric" id="fps-counter">FPS: 60.0</div>
        <div class="hud-metric" id="ping-counter">NET LATENCY: 0.2 ms</div>
    </div>
    <canvas id="canvas-hud"></canvas>

    <script>
        const canvas = document.getElementById("canvas-hud");
        const ctx = canvas.getContext("2d");
        
        function resize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
        }
        window.addEventListener('resize', resize);
        resize();

        // Target state map: Stores past and target states for Hermite Cubic Interpolation
        const targetMap = new Map();

        // WebSocket Zero-Buffer Client
        const ws = new WebSocket("ws://" + window.location.hostname + ":8001");
        ws.binaryType = "arraybuffer";

        ws.onmessage = (event) => {
            const view = new DataView(event.data);
            const stride = 48; // 48 bytes per target struct
            const count = event.data.byteLength / stride;
            const receiveTime = performance.now();

            for (let i = 0; i < count; i++) {
                const offset = i * stride;
                const timestamp = view.getFloat64(offset, false);
                const id = view.getUint32(offset + 4, false);
                const x = view.getFloat32(offset + 8, false);
                const y = view.getFloat32(offset + 12, false);
                const z = view.getFloat32(offset + 16, false);
                const vx = view.getFloat32(offset + 20, false);
                const vy = view.getFloat32(offset + 24, false);
                const vz = view.getFloat32(offset + 28, false);

                if (!targetMap.has(id)) {
                    targetMap.set(id, { currX: x, currY: y, targetX: x, targetY: y, vx, vy, lastUpdate: receiveTime });
                } else {
                    const t = targetMap.get(id);
                    // Hermite / Velocity extrapolation transition
                    t.currX = t.targetX;
                    t.currY = t.targetY;
                    t.targetX = x;
                    t.targetY = y;
                    t.vx = vx;
                    t.vy = vy;
                    t.lastUpdate = receiveTime;
                }
            }
        };

        // Render Loop: Locked to monitor refresh rate using requestAnimationFrame
        let lastFrameTime = performance.now();
        let sweepAngle = 0;

        function render() {
            const now = performance.now();
            const dt = (now - lastFrameTime) / 1000.0;
            lastFrameTime = now;

            document.getElementById("fps-counter").innerText = `FPS: ${(1.0 / dt).toFixed(1)}`;

            // Clear screen with phosphor trail effect
            ctx.fillStyle = "rgba(2, 6, 8, 0.15)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = Math.min(cx, cy) * 0.85;

            // Draw Tactical Grid Rings
            ctx.strokeStyle = "rgba(0, 255, 204, 0.2)";
            ctx.lineWidth = 1.5;
            for (let r = 0.2; r <= 1.0; r += 0.2) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius * r, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Draw High-Speed Rotating Radar Sweep Line
            sweepAngle += dt * 2.0; // 2 rads/sec
            ctx.strokeStyle = "rgba(0, 255, 204, 0.8)";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(sweepAngle) * radius, cy + Math.sin(sweepAngle) * radius);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Render Extrapolated Targets
            targetMap.forEach((t) => {
                // Extrapolate position using velocity vector between server ticks
                const timeSinceUpdate = (now - t.lastUpdate) / 1000.0;
                const renderX = cx + (t.targetX + t.vx * timeSinceUpdate) * 0.05;
                const renderY = cy + (t.targetY + t.vy * timeSinceUpdate) * 0.05;

                // Glowing blip
                ctx.fillStyle = "#ff3366";
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#ff3366";
                ctx.beginPath();
                ctx.arc(renderX, renderY, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Velocity Vector Line
                ctx.strokeStyle = "#ff3366";
                ctx.beginPath();
                ctx.moveTo(renderX, renderY);
                ctx.lineTo(renderX + t.vx * 0.1, renderY + t.vy * 0.1);
                ctx.stroke();
            });

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
